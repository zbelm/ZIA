<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Zia, From Zach 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FFF8F5;
      --blush: #F2B8C0;
      --rose: #C4837B;
      --rose-deep: #8B4A50;
      --text: #3D1F24;
      --muted: #8A6468;
      --dark: #1A0D0F;
      --shadow: rgba(196, 131, 123, 0.18);
      --gold: #F7E7A0;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #000;
    }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      background: #000;
    }

    .screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
    }

    #mg-screen {
      background: linear-gradient(175deg, #1A0D0F 0%, #3D1F24 60%, #5C2D35 100%);
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem 1rem 2rem;
    }

    .mg-header {
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
      margin-bottom: 1rem;
    }

    .mg-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--blush);
      margin: 0;
      line-height: 1.1;
    }

    .mg-sub {
      margin-top: 0.5rem;
      color: rgba(242, 184, 192, 0.7);
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .mg-hud {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.5rem 2rem;
      width: 100%;
      position: relative;
      z-index: 2;
      margin-top: 0.75rem;
    }

    .mg-score-box {
      text-align: center;
    }

    .mg-score-num {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: #fff;
      line-height: 1;
    }

    .mg-score-lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(242, 184, 192, 0.5);
    }

    .mg-bar-wrap {
      width: 180px;
      height: 5px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .mg-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--blush), #fff);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .mg-bar-lbl {
      display: block;
      margin-top: 0.25rem;
      color: rgba(242,184,192,0.4);
      font-size: 0.65rem;
      text-align: right;
    }

    #mg-area {
      position: relative;
      width: min(100%, 700px);
      flex: 1;
      min-height: 360px;
      margin-top: 1rem;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.08);
    }

    .mg-bg-star {
      position: absolute;
      font-size: 0.9rem;
      color: rgba(242,184,192,0.42);
      animation: starTwinkle var(--d, 3s) ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .heart-drop {
      position: absolute;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(0 0 8px rgba(242, 184, 192, 0.55));
      animation: wobble 1.5s ease-in-out infinite;
      transition: transform 0.15s ease;
    }

    .heart-drop:hover {
      transform: scale(1.25) !important;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    .pop-anim,
    .score-fly {
      position: fixed;
      pointer-events: none;
      z-index: 999;
    }

    .pop-anim {
      font-size: 1.5rem;
      animation: popUp 0.7s ease forwards;
    }

    @keyframes popUp {
      0% { opacity: 1; transform: scale(0.5) translateY(0); }
      100% { opacity: 0; transform: scale(2) translateY(-60px); }
    }

    .score-fly {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--blush);
      animation: flyUp 0.9s ease forwards;
    }

    @keyframes flyUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-70px); }
    }

    .mg-win {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: rgba(26,13,15,0.9);
      z-index: 10;
    }

    .mg-win.show {
      display: flex;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .mg-win-emoji {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: bounce 1s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    .mg-win-title {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: var(--blush);
      font-style: italic;
    }

    .mg-win-sub {
      margin: 0.75rem auto 2rem;
      max-width: 360px;
      color: rgba(242,184,192,0.75);
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .btn-enter {
      background: linear-gradient(135deg, var(--blush), #fff);
      color: var(--rose-deep);
      border-radius: 999px;
      padding: 1rem 2.5rem;
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(255,255,255,0.15);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .btn-enter:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    #fl-screen {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      isolation: isolate;
    }

    .night-sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 12%, rgba(120, 168, 255, 0.3), transparent 22%),
        radial-gradient(circle at 10% 80%, rgba(255, 105, 150, 0.08), transparent 22%),
        linear-gradient(180deg, #000 0%, #090812 32%, #130d1a 100%);
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .fl-title {
      position: absolute;
      left: 0;
      top: 2.5rem;
      width: 100%;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.8rem, 8vw, 5.2rem);
      color: #fff;
      text-shadow: 0 0 18px rgba(255,255,255,0.5);
      z-index: 20;
    }

    .flower-scene {
      position: relative;
      width: min(90vw, 680px);
      height: min(85vh, 760px);
      z-index: 5;
    }

    .flower-ground {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 280px;
      background: linear-gradient(180deg, rgba(255, 130, 176, 0.14), rgba(0,0,0,0) 30%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .flower-stem {
      position: absolute;
      left: 50%;
      bottom: 42px;
      width: 12px;
      height: 46vh;
      min-height: 260px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #f4d6d9 0%, #b9f0af 30%, #7ac690 100%);
      border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.4);
      z-index: 4;
    }

    .flower-leaf {
      position: absolute;
      width: 120px;
      height: 70px;
      background: linear-gradient(180deg, rgba(179, 245, 170, 0.9), rgba(95, 175, 130, 0.9));
      border-radius: 100% 0 100% 0;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.3);
      z-index: 3;
    }

    .flower-leaf--left {
      left: calc(50% - 118px);
      bottom: 140px;
      transform: rotate(-32deg);
    }

    .flower-leaf--right {
      left: calc(50% + 10px);
      bottom: 118px;
      transform: rotate(38deg) scaleX(-1);
    }

    .flower-bloom {
      position: absolute;
      left: 50%;
      bottom: 42vh;
      width: 220px;
      height: 220px;
      transform: translateX(-50%);
      z-index: 10;
    }

    .flower-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #fff5b3 0%, #ffd95f 35%, #f4bd42 100%);
      box-shadow: 0 0 20px rgba(255, 223, 115, 0.8);
      z-index: 12;
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 80px;
      height: 110px;
      transform-origin: center bottom;
      border-radius: 60% 60% 65% 65%;
      background: linear-gradient(180deg, #ffbfd0 0%, #ff8ab0 50%, #ff6b93 100%);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.3);
      animation: bloom 5s ease-in-out infinite alternate;
    }

    .petal:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg) translateY(-34px); }
    .petal:nth-child(2) { transform: translate(-50%, -50%) rotate(45deg) translateY(-34px); }
    .petal:nth-child(3) { transform: translate(-50%, -50%) rotate(90deg) translateY(-34px); }
    .petal:nth-child(4) { transform: translate(-50%, -50%) rotate(135deg) translateY(-34px); }
    .petal:nth-child(5) { transform: translate(-50%, -50%) rotate(180deg) translateY(-34px); }
    .petal:nth-child(6) { transform: translate(-50%, -50%) rotate(225deg) translateY(-34px); }
    .petal:nth-child(7) { transform: translate(-50%, -50%) rotate(270deg) translateY(-34px); }
    .petal:nth-child(8) { transform: translate(-50%, -50%) rotate(315deg) translateY(-34px); }

    @keyframes bloom {
      0% { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) translateY(-34px) scale(0.95); }
      100% { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) translateY(-30px) scale(1.08); }
    }

    .petal:nth-child(1) { --rot: 0deg; }
    .petal:nth-child(2) { --rot: 45deg; }
    .petal:nth-child(3) { --rot: 90deg; }
    .petal:nth-child(4) { --rot: 135deg; }
    .petal:nth-child(5) { --rot: 180deg; }
    .petal:nth-child(6) { --rot: 225deg; }
    .petal:nth-child(7) { --rot: 270deg; }
    .petal:nth-child(8) { --rot: 315deg; }

    .flower-btn {
      position: absolute;
      left: 50%;
      bottom: 6vh;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.4);
      color: #fff;
      border-radius: 999px;
      padding: 0.9rem 2rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .flower-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateX(-50%) translateY(-2px);
    }

    @media (max-width: 600px) {
      #mg-area {
        min-height: 300px;
      }

      .mg-hud {
        gap: 1rem 1.5rem;
      }

      .mg-bar-wrap {
        width: 150px;
      }

      .flower-bloom {
        transform: translateX(-50%) scale(0.8);
        bottom: 42vh;
      }
    }
  </style>
</head>
<body>
  <section id="mg-screen" class="screen active" aria-label="Mini game screen">
    <header class="mg-header">
      <h1 class="mg-title">For Zia, From Zach 💕</h1>
      <div class="mg-sub">collect the love</div>
    </header>

    <div class="mg-hud" aria-live="polite">
      <div class="mg-score-box">
        <span class="mg-score-num" id="score">0</span>
        <span class="mg-score-lbl">love points</span>
      </div>

      <div>
        <div class="mg-bar-wrap"><div class="mg-bar" id="progressBar"></div></div>
        <span class="mg-bar-lbl" id="progressText">0 / 10</span>
      </div>
    </div>

    <div id="mg-area" aria-label="Love collecting area"></div>

    <div class="mg-win" id="winOverlay" aria-live="polite">
      <div class="mg-win-emoji">💖</div>
      <h2 class="mg-win-title">You did it, love.</h2>
      <p class="mg-win-sub">You gathered all the heart energy. Now let’s go to the flower scene.</p>
      <button class="btn-enter" id="nextScreenBtn">Enter the garden</button>
    </div>
  </section>

  <section id="fl-screen" class="screen" aria-label="Flower screen">
    <div class="night-sky" aria-hidden="true">
      <span class="star" style="left:10%; top:10%; animation-delay:0s"></span>
      <span class="star" style="left:18%; top:18%; animation-delay:1.2s"></span>
      <span class="star" style="left:26%; top:12%; animation-delay:2.5s"></span>
      <span class="star" style="left:40%; top:22%; animation-delay:0.8s"></span>
      <span class="star" style="left:58%; top:15%; animation-delay:1.7s"></span>
      <span class="star" style="left:72%; top:24%; animation-delay:2.2s"></span>
      <span class="star" style="left:82%; top:18%; animation-delay:0.4s"></span>
      <span class="star" style="left:90%; top:10%; animation-delay:1.1s"></span>
    </div>

    <h2 class="fl-title">for zia</h2>

    <div class="flower-scene" aria-label="Decorative flower scene">
      <div class="flower-ground"></div>
      <div class="flower-stem"></div>
      <div class="flower-leaf flower-leaf--left"></div>
      <div class="flower-leaf flower-leaf--right"></div>

      <div class="flower-bloom" aria-hidden="true">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="flower-center"></div>
      </div>
    </div>

    <button class="flower-btn" id="backBtn">Back to love</button>
  </section>

  <script>
    const screens = document.querySelectorAll('.screen');
    const scoreEl = document.getElementById('score');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const winOverlay = document.getElementById('winOverlay');
    const mgArea = document.getElementById('mg-area');
    const nextScreenBtn = document.getElementById('nextScreenBtn');
    const backBtn = document.getElementById('backBtn');

    const targetScore = 10;
    let score = 0;

    function showScreen(id) {
      screens.forEach(screen => {
        screen.classList.toggle('active', screen.id === id);
      });
    }

    function createStarField() {
      for (let i = 0; i < 30; i++) {
        const star = document.createElement('span');
        star.className = 'mg-bg-star';
        star.textContent = '✦';
        star.style.left = (Math.random() * 100) + '%';
        star.style.top = (Math.random() * 100) + '%';
        star.style.setProperty('--d', (Math.random() * 3 + 2).toFixed(2) + 's');
        star.style.fontSize = (Math.random() * 1.2 + 0.8).toFixed(2) + 'rem';
        star.style.opacity = (Math.random() * 0.8 + 0.2).toFixed(2);
        mgArea.appendChild(star);
      }
    }

    function spawnHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart-drop';
      heart.textContent = '💗';

      const left = Math.random() * 80 + 5;
      const top = Math.random() * 70 + 10;
      heart.style.left = left + '%';
      heart.style.top = top + '%';
      heart.style.transform = `scale(${Math.random() * 0.8 + 0.7})`;

      heart.addEventListener('click', () => {
        if (heart.dataset.popped === 'true') return;
        heart.dataset.popped = 'true';

        score += 1;
        scoreEl.textContent = score;
        progressBar.style.width = `${(score / targetScore) * 100}%`;
        progressText.textContent = `${score} / ${targetScore}`;

        const pop = document.createElement('div');
        pop.className = 'pop-anim';
        pop.textContent = '💗';
        pop.style.left = heart.offsetLeft + heart.offsetWidth / 2 + 'px';
        pop.style.top = heart.offsetTop + heart.offsetHeight / 2 + 'px';
        document.body.appendChild(pop);

        const scoreFly = document.createElement('div');
        scoreFly.className = 'score-fly';
        scoreFly.textContent = '+1';
        scoreFly.style.left = pop.style.left;
        scoreFly.style.top = pop.style.top;
        document.body.appendChild(scoreFly);

        setTimeout(() => pop.remove(), 700);
        setTimeout(() => scoreFly.remove(), 900);
        heart.remove();

        if (score >= targetScore) {
          setTimeout(() => {
            winOverlay.classList.add('show');
          }, 200);
        } else {
          setTimeout(spawnHeart, 350);
        }
      });

      mgArea.appendChild(heart);
    }

    function resetGame() {
      score = 0;
      scoreEl.textContent = '0';
      progressBar.style.width = '0%';
      progressText.textContent = '0 / 10';
      winOverlay.classList.remove('show');
      mgArea.innerHTML = '';
      createStarField();
      for (let i = 0; i < 8; i++) {
        setTimeout(spawnHeart, i * 180);
      }
    }

    nextScreenBtn.addEventListener('click', () => showScreen('fl-screen'));
    backBtn.addEventListener('click', () => showScreen('mg-screen'));

    resetGame();
  </script>
</body>
</html>
